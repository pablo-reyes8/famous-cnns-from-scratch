name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install quality tools
        run: python -m pip install ruff==0.15.21
      - name: Lint
        run: ruff check famous_cnns scripts tests */scripts
      - name: Format check
        run: ruff format --check famous_cnns scripts tests */scripts

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run tests
        run: pytest --cov=famous_cnns --cov-report=term-missing --cov-report=xml --cov-fail-under=50
      - name: CLI smoke test
        run: |
          famous-cnns list
          famous-cnns train --model lenet5 --num-classes 2 --batch-size 2 --epochs 1 --smoke-test --output /tmp/lenet.pt
          famous-cnns infer --checkpoint /tmp/lenet.pt --smoke-test

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install build
      - run: python -m build
      - name: Check wheel contents
        run: python -m zipfile -l dist/*.whl
